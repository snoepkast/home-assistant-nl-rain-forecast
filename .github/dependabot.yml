# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-tooling:
        patterns:
          - "ruff"
          - "ty"
          - "pytest*"
          - "pre-commit"
    ignore:
      # Pin homeassistant to whatever's in hacs.json — bump those manually.
      - dependency-name: "homeassistant"
