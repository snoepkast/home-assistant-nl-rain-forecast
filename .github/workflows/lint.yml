name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable from release.yml so cutting a release re-runs lint on the
  # tagged commit.
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Ruff + ty
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: ty type-check
        run: uv run ty check
