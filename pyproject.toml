[project]
name = "nl-rain-forecast"
version = "0.1.0"
description = "Home Assistant custom integration exposing Dutch per-5-minute rain nowcasts (Buienradar, Buienalarm, and Open-Meteo) as sensors."
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "MIT" }
authors = [{ name = "snoepkast" }]

[dependency-groups]
dev = [
    "homeassistant==2026.3.2",
    "colorlog==6.10.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component>=0.13.190",
    "aioresponses>=0.7.7",
    "ruff>=0.15.16",
    "ty>=0.0.44",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff
# Inherits philosophy from Home Assistant core's pyproject.toml.
# https://github.com/home-assistant/core/blob/dev/pyproject.toml
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",   # Dynamically typed expressions (typing.Any) are allowed where pragmatic
    "TID252",   # Relative imports inside the integration package are HA convention
    "D102",     # Missing docstring in public method — noisy on HA framework overrides
    "D107",     # Missing docstring in __init__ — class docstring covers it
    "D203",     # incompatible with formatter
    "D212",     # incompatible with formatter
    "COM812",   # incompatible with formatter
    "ISC001",   # incompatible with formatter
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # asserts allowed in tests
    "SLF001",   # private member access allowed in tests
    "PLR2004",  # magic values allowed in tests
    "ANN",      # type annotations not required in tests
    "D",        # docstrings not required in tests
    "INP001",   # implicit namespace OK for tests dir
]

# ---------------------------------------------------------------------------
# ty (Astral type checker, beta)
# ---------------------------------------------------------------------------
[tool.ty.src]
include = ["custom_components/nl_rain_forecast"]

[tool.ty.rules]
unused-ignore-comment = "warn"
possibly-missing-import = "error"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["custom_components/nl_rain_forecast"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
